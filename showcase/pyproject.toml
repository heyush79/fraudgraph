[project]
name = "fraudgraph-showcase"
version = "0.1.0"
description = "Records a real FraudGraph session into the static replay the public console plays"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
