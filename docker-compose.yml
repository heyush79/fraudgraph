# FraudGraph — single-node dev stack.
#   docker compose up -d            -> infra only (kafka, redis, postgres, topic init)
#   docker compose --profile demo up -> infra + stream-engine + generator (see `make demo`)
#
# Kafka runs in KRaft mode (no ZooKeeper). Two listeners:
#   kafka:9092       -> for containers on the compose network
#   localhost:29092  -> for processes running on the host (IDE, pytest, mvn)
services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: fraudgraph-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single broker: every replication factor / ISR must be 1, including the
      # transaction log — the stream engine runs exactly_once_v2 and needs it.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-init with the partition counts
      # from the LLD (§2). Auto-create would silently give the wrong counts.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:3.8.1
    container_name: fraudgraph-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # Partition counts and retention straight from LLD §2. Idempotent (--if-not-exists).
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:9092
        $$T --bootstrap-server $$B --create --if-not-exists --topic transactions.raw    --partitions 6 --replication-factor 1 --config retention.ms=86400000
        $$T --bootstrap-server $$B --create --if-not-exists --topic transactions.labels --partitions 3 --replication-factor 1 --config retention.ms=604800000
        $$T --bootstrap-server $$B --create --if-not-exists --topic fraud.decisions     --partitions 6 --replication-factor 1 --config retention.ms=604800000 --config cleanup.policy=delete
        $$T --bootstrap-server $$B --create --if-not-exists --topic transactions.dlq    --partitions 1 --replication-factor 1 --config retention.ms=604800000
        $$T --bootstrap-server $$B --list

  redis:
    image: redis:7-alpine
    container_name: fraudgraph-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: fraudgraph-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fraudgraph
      POSTGRES_PASSWORD: fraudgraph
      POSTGRES_DB: fraudgraph
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudgraph"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- application services (profile: demo) ------------------------------
  stream-engine:
    build: ./stream-engine
    container_name: fraudgraph-stream-engine
    profiles: ["demo"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    environment:
      FRAUDGRAPH_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FRAUDGRAPH_KAFKA_STATE_DIR: /var/lib/fraudgraph/state
    volumes:
      - stream-state:/var/lib/fraudgraph/state

  generator:
    build: ./generator
    container_name: fraudgraph-generator
    profiles: ["demo"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      FRAUDGRAPH_BOOTSTRAP_SERVERS: kafka:9092
    command: ["--tps", "${GEN_TPS:-50}", "--fraud-rate", "${GEN_FRAUD_RATE:-0.02}", "--patterns", "${GEN_PATTERNS:-velocity}"]

volumes:
  kafka-data:
  postgres-data:
  stream-state:
