# FraudGraph — single-node dev stack.
#   docker compose up -d            -> infra only (kafka, redis, postgres, topic init)
#   docker compose --profile demo up -> infra + stream-engine + generator (see `make demo`)
#
# Kafka runs in KRaft mode (no ZooKeeper). Two listeners:
#   kafka:9092       -> for containers on the compose network
#   localhost:29092  -> for processes running on the host (IDE, pytest, mvn)
services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: fraudgraph-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single broker: every replication factor / ISR must be 1, including the
      # transaction log — the stream engine runs exactly_once_v2 and needs it.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-init with the partition counts
      # from the LLD (§2). Auto-create would silently give the wrong counts.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:3.8.1
    container_name: fraudgraph-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # Partition counts and retention straight from LLD §2. Idempotent (--if-not-exists).
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:9092
        $$T --bootstrap-server $$B --create --if-not-exists --topic transactions.raw    --partitions 6 --replication-factor 1 --config retention.ms=86400000
        $$T --bootstrap-server $$B --create --if-not-exists --topic transactions.labels --partitions 3 --replication-factor 1 --config retention.ms=604800000
        $$T --bootstrap-server $$B --create --if-not-exists --topic fraud.decisions     --partitions 6 --replication-factor 1 --config retention.ms=604800000 --config cleanup.policy=delete
        $$T --bootstrap-server $$B --create --if-not-exists --topic transactions.dlq    --partitions 1 --replication-factor 1 --config retention.ms=604800000
        $$T --bootstrap-server $$B --list

  redis:
    image: redis:7-alpine
    container_name: fraudgraph-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: fraudgraph-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fraudgraph
      POSTGRES_PASSWORD: fraudgraph
      POSTGRES_DB: fraudgraph
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudgraph"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- developer tools (profile: tools) -----------------------------------
  # Postgres speaks its own binary wire protocol, not HTTP, so a browser cannot reach it
  # directly. Adminer is a single-file web client that can: `make db-ui`, then localhost:8080.
  # Kept out of the demo profile because it is a debugging aid, not part of the system, and
  # it would be a plaintext-credentials admin console on a published port.
  adminer:
    image: adminer:4-standalone
    container_name: fraudgraph-adminer
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula

  # ---- application services (profile: demo) ------------------------------
  ml-scorer:
    build:
      context: .                       # repo root: the shared proto must be in the build context
      dockerfile: ml-scorer/Dockerfile
    container_name: fraudgraph-ml-scorer
    profiles: ["demo"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "50051:50051"                  # gRPC scoring
      - "8000:8000"                    # admin: /health /model /reload /metrics
    environment:
      SCORER_REGISTRY: /app/registry
      SCORER_SHAP_MIN_PROB: "0.4"
      FRAUDGRAPH_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      # bind mount so `make train` (in a sibling container) and the server share versions
      - ./ml-scorer/registry:/app/registry
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6

  stream-engine:
    build:
      context: .
      dockerfile: stream-engine/Dockerfile
    container_name: fraudgraph-stream-engine
    profiles: ["demo"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      ml-scorer:
        condition: service_started   # started, not healthy: the engine must run DEGRADED without a scorer
    ports:
      - "8081:8081"
    environment:
      FRAUDGRAPH_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FRAUDGRAPH_KAFKA_STATE_DIR: /var/lib/fraudgraph/state
      FRAUDGRAPH_SCORING_HOST: ml-scorer
    volumes:
      - stream-state:/var/lib/fraudgraph/state

  case-service:
    build:
      context: ./case-service
    container_name: fraudgraph-case-service
    profiles: ["demo"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      FRAUDGRAPH_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FRAUDGRAPH_DB_URL: jdbc:postgresql://postgres:5432/fraudgraph
      FRAUDGRAPH_REDIS_HOST: redis
      FRAUDGRAPH_ENGINE_URL: http://stream-engine:8081
      FRAUDGRAPH_AGENT_ENABLED: ${FRAUDGRAPH_AGENT_ENABLED:-true}
      FRAUDGRAPH_AGENT_URL: http://analyst-agent:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  analyst-agent:
    build:
      context: ./analyst-agent
    container_name: fraudgraph-analyst-agent
    profiles: ["demo"]
    depends_on:
      case-service:
        condition: service_started
    ports:
      # 8000 belongs to ml-scorer's admin API, so the agent takes 8010 on the host
      - "8010:8000"
    environment:
      FRAUDGRAPH_CASE_SERVICE_URL: http://case-service:8082
      FRAUDGRAPH_LLM_PROVIDER: ${FRAUDGRAPH_LLM_PROVIDER:-groq}
      FRAUDGRAPH_LLM_MODEL: ${FRAUDGRAPH_LLM_MODEL:-openai/gpt-oss-120b}
      FRAUDGRAPH_CHROMA_PATH: /app/chroma
      # empty is fine: the agent then serves /health with status NO_MODEL and the case
      # service's hand-off queue gives up after its retries, which breaks nothing else
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - ./analyst-agent/chroma:/app/chroma

  dashboard:
    build:
      context: ./dashboard
    container_name: fraudgraph-dashboard
    profiles: ["demo"]
    depends_on:
      case-service:
        condition: service_started
    ports:
      - "3000:80"

  generator:
    build:
      context: ./generator
    container_name: fraudgraph-generator
    profiles: ["demo"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      FRAUDGRAPH_BOOTSTRAP_SERVERS: kafka:9092
      FRAUDGRAPH_PATTERNS: ${GEN_PATTERNS:-velocity,ring,geo}
      FRAUDGRAPH_USERS: ${GEN_USERS:-20000}
      FRAUDGRAPH_DURATION: ${GEN_DURATION:-}     # empty = run until stopped
    command: ["--tps", "${GEN_TPS:-50}", "--fraud-rate", "${GEN_FRAUD_RATE:-0.02}"]

volumes:
  kafka-data:
  postgres-data:
  stream-state:
