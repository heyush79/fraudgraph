# Serves the built SPA and proxies the case-service API + WebSocket, so the app
# is same-origin in production and needs no VITE_API_BASE.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite writes content-hashed asset names, so they are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The decision ticker: plain WebSocket, needs the upgrade dance.
    location /ws {
        proxy_pass http://case-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # A quiet feed must not be torn down; the server batches every ~200ms
        # but an idle system can send nothing for a long time.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /cases {
        proxy_pass http://case-service:8082;
        include /etc/nginx/fraudgraph-proxy.conf;
    }

    location /stats {
        proxy_pass http://case-service:8082;
        include /etc/nginx/fraudgraph-proxy.conf;
    }

    location /internal {
        proxy_pass http://case-service:8082;
        include /etc/nginx/fraudgraph-proxy.conf;
    }

    # SPA history fallback. Hash routing means this is rarely exercised, but a
    # bookmarked /anything must still serve the app rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
