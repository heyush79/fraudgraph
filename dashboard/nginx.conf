# Serves the built SPA and proxies the case-service API + WebSocket and the
# analyst agent, so the app is same-origin in production and needs no
# VITE_API_BASE.

# Public mode (PUBLIC_MODE=true, set by deploy/): the only request that is not a
# read is a question to the analyst, and of the agent's endpoints only /health and
# /ask are reachable. Enforced here rather than merely hidden in the UI. Evaluated
# only when public-mode.conf is non-empty (docker-entrypoint.d/40-public-mode.sh).
map "$request_method $uri" $fraudgraph_public_denied {
    default                                 0;
    "~^(GET|HEAD) /agent/(?!health$)"       1;
    "~^POST /agent/cases/[^/]+/ask$"        0;
    "~^(GET|HEAD|OPTIONS) "                 0;
    "~^"                                    1;
}

server {
    listen 80;
    server_name _;

    # Behind Caddy (deploy/) or a Cloudflare tunnel the peer is a proxy on a
    # private network; take the visitor's address from X-Forwarded-For so logs and
    # the analyst's per-visitor rate limit see visitors, not the proxy.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/fraudgraph-public-mode.conf;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite writes content-hashed asset names, so they are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The decision ticker: plain WebSocket, needs the upgrade dance.
    location /ws {
        proxy_pass http://case-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # A quiet feed must not be torn down; the server batches every ~200ms
        # but an idle system can send nothing for a long time.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /cases {
        proxy_pass http://case-service:8082;
        include /etc/nginx/fraudgraph-proxy.conf;
    }

    location /stats {
        proxy_pass http://case-service:8082;
        include /etc/nginx/fraudgraph-proxy.conf;
    }

    location /internal {
        proxy_pass http://case-service:8082;
        include /etc/nginx/fraudgraph-proxy.conf;
    }

    # The analyst agent: /agent/* -> analyst-agent:8000/*, prefix stripped
    # (docs/showcase-contract.md section 2). The upstream is a variable resolved
    # through Docker's DNS at request time, so nginx still starts when the agent is
    # not part of the deployment; the console then reports the analyst as
    # unreachable and everything else keeps working.
    location /agent/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $agent_upstream http://analyst-agent:8000;
        rewrite ^/agent/(.*)$ /$1 break;
        proxy_pass $agent_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The agent's per-client rate limit keys on X-Real-IP (or CF-Connecting-IP,
        # which passes through untouched when a Cloudflare tunnel is in front).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # An answer is one or two model calls on a free tier, typically 2-4 s;
        # leave room for a slow provider rather than cutting it off at 30 s.
        proxy_read_timeout 120s;
    }

    # SPA history fallback. Hash routing means this is rarely exercised, but a
    # bookmarked /anything must still serve the app rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
