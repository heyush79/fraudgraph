[project]
name = "fraudgraph-analyst-agent"
version = "0.1.0"
description = "LangGraph analyst agent: investigates fraud cases and writes evidence-cited reports"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph>=0.2.45",
    "langchain-core>=0.3.15",
    "langchain-groq>=0.2",
    "pydantic>=2.9",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # chromadb's default embedding function is all-MiniLM-L6-v2 via onnxruntime, the same
    # model the LLD names, without dragging torch and 2 GB of wheels into the image.
    "chromadb>=0.5.20",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "confluent-kafka>=2.5"]
# swap the provider without touching the graph
ollama = ["langchain-ollama>=0.2"]
gemini = ["langchain-google-genai>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
