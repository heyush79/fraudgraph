[project]
name = "fraudgraph-generator"
version = "0.1.0"
description = "Synthetic payment traffic + fraud injectors for FraudGraph"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
fraudgraph-generator = "generator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
