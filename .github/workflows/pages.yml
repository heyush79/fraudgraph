name: Pages

# The permanent public demo: the dashboard in replay mode, playing a recorded session of the
# real pipeline from static JSON (dashboard/public/showcase, written by showcase/record.py). No
# backend runs anywhere, so the link cannot go down, cannot be abused and costs nothing.
#
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Refuse to publish without a recording
        run: |
          test -f dashboard/public/showcase/manifest.json || {
            echo "::error::no recording in dashboard/public/showcase; run showcase/record.py and commit it"
            exit 1
          }
      - run: npm ci
        working-directory: dashboard
      # Served from https://<owner>.github.io/<repo>/, so every asset and every fetch of the
      # recording is relative to that base.
      - run: npm run build -- --base /${{ github.event.repository.name }}/
        working-directory: dashboard
        env:
          VITE_DATA_MODE: replay
          VITE_READ_ONLY: "true"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
