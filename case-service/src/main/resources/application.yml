spring:
  application:
    name: case-service

  datasource:
    url: ${FRAUDGRAPH_DB_URL:jdbc:postgresql://localhost:5432/fraudgraph}
    username: ${FRAUDGRAPH_DB_USER:fraudgraph}
    password: ${FRAUDGRAPH_DB_PASSWORD:fraudgraph}
    hikari:
      maximum-pool-size: 10      # one Kafka listener thread + web requests; 10 is generous

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${FRAUDGRAPH_REDIS_HOST:localhost}
      port: ${FRAUDGRAPH_REDIS_PORT:6379}
      timeout: 500ms             # Redis is a nice-to-have here; never let it stall the listener

  kafka:
    bootstrap-servers: ${FRAUDGRAPH_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: fraudgraph-case-service
      # `latest`, not `earliest`: on a first start the decisions topic holds up to 7 days of
      # history and replaying it would create tens of thousands of stale cases. A restart
      # resumes from the committed offset, so nothing in flight is lost.
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # decisions are consumed as raw JSON text: the parsed fields drive the case row and the
      # untouched original is what goes into decision_doc
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 500
      enable-auto-commit: false
    listener:
      ack-mode: batch

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

fraudgraph:
  topics:
    decisions: fraud.decisions

  feed:
    flushMillis: 200             # one WebSocket frame per 200ms instead of ~50 tiny frames a second
    maxQueued: 2000              # bounded buffer; a slow or absent browser must never grow the heap
    maxHistory: 200              # ticks a newly connected client receives as backfill

  recent:
    enabled: true
    perUser: 50                  # LLD §6.1 get_user_history: the agent needs recent txns, not all of them
    ttlHours: 24                 # matches the graph edge TTL, so the two agent tools agree on "recent"

  engine:
    baseUrl: ${FRAUDGRAPH_ENGINE_URL:http://localhost:8081}
    timeoutMillis: 1000          # the read API is an interactive query against local RocksDB; 1s is generous

  agent:
    enabled: ${FRAUDGRAPH_AGENT_ENABLED:false}   # the analyst agent arrives in Phase 5
    baseUrl: ${FRAUDGRAPH_AGENT_URL:http://localhost:8000}
    timeoutMillis: 2000
    maxQueued: 500               # fire-and-forget with a bounded retry queue (LLD §5.2)
    maxAttempts: 3
